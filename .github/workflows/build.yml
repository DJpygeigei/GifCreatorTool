name: Build GIFTool

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 也可以手动触发

jobs:
  # ─────────── Windows EXE ───────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PySide6 pyinstaller pillow

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          # 用 GitHub Actions 官方 ffmpeg action 更可靠
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $bin = (Get-ChildItem -Path ffmpeg_extract -Filter "bin" -Recurse -Directory | Select-Object -First 1).FullName
          Copy-Item "$bin\ffmpeg.exe"  -Destination "ffmpeg.exe"
          Copy-Item "$bin\ffprobe.exe" -Destination "ffprobe.exe"
          Remove-Item ffmpeg.zip, ffmpeg_extract -Recurse -Force

      - name: Generate logo.ico
        shell: pwsh
        run: |
          python -c @"
          from PIL import Image
          import os
          if os.path.exists('logo.jpg'):
              img = Image.open('logo.jpg').convert('RGBA')
              img.save('logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "@

      - name: Build EXE
        run: pyinstaller giftool.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIFTool-Windows
          path: dist/GIFTool.exe

  # ─────────── macOS APP ───────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PySide6 pyinstaller pillow

      - name: Install ffmpeg (macOS)
        run: brew install ffmpeg

      - name: Copy ffmpeg binaries
        run: |
          cp $(which ffmpeg)  ./ffmpeg
          cp $(which ffprobe) ./ffprobe

      - name: Build macOS app
        run: |
          pyinstaller giftool.spec --noconfirm

      - name: Package as zip
        run: |
          cd dist
          zip -r GIFTool-macOS.zip GIFTool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIFTool-macOS
          path: dist/GIFTool-macOS.zip

  # ─────────── 发布到 Release ───────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GIFTool-Windows
          path: ./artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GIFTool-macOS
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GIFTool.exe
            artifacts/GIFTool-macOS.zip
          generate_release_notes: true
