name: Build & Release

on:
  push:
    tags:
      - 'v*'          # 只有推 vX.X.X tag 才触发
  workflow_dispatch:  # 手动触发保留

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # 允许创建 Release / 上传 assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow mss pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem -Path ffmpeg_tmp -Filter "bin" -Recurse -Directory | Select-Object -First 1).FullName
          Copy-Item "$bin\ffmpeg.exe"  -Destination "ffmpeg.exe"
          Copy-Item "$bin\ffprobe.exe" -Destination "ffprobe.exe"
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force
          Write-Host "ffmpeg.exe size: $((Get-Item ffmpeg.exe).Length)"

      - name: Set version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content main.py) -replace 'VERSION\s*=\s*"[^"]+"', "VERSION = `"$ver`"" |
            Set-Content main.py -Encoding UTF8
          Write-Host "VERSION set to $ver"

      - name: Build exe
        run: |
          python -m PyInstaller giftool.spec --noconfirm

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIFTool-windows-${{ steps.sha.outputs.sha }}
          path: dist/GIFTool.exe
          retention-days: 30

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GIFTool.exe
          generate_release_notes: true
